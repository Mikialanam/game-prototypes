<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trains">
<title>Ayman's Trains</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #2d4a6b;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #stage { flex: 1; position: relative; min-height: 0; background: #5aa84f; }
  #world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #bar {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px;
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); background: #2d4a6b;
  }
  .gap { width: 10px; }
  .btn {
    width: clamp(80px, calc((100vw - 150px) / 13), 92px); height: clamp(80px, calc((100vw - 150px) / 13), 92px); border-radius: 22px; border: 0; padding: 0; margin: 0;
    background: #fff; box-shadow: 0 6px 0 rgba(0,0,0,.28); cursor: pointer;
    transition: transform .08s, box-shadow .08s, background .15s; touch-action: manipulation;
    flex: 0 0 auto;
  }
  .btn canvas { width: 100%; height: 100%; display: block; pointer-events: none; }
  .btn.on { background: #ffe066; transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.28), 0 0 0 5px #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.28); }
  .btn.undo { background: #bfe3ff; }
  .btn.clear { background: #ffb3b3; }
  .btn.sky { background: #d9ccff; }
  #picker {
    position: absolute; left: 0; right: 0; margin: 0 auto; width: max-content; bottom: 12px; transform: scale(.9);
    display: flex; gap: 12px; padding: 14px; background: rgba(45,74,107,.94); border-radius: 30px;
    opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; max-width: calc(100% - 24px);
    flex-wrap: wrap; justify-content: center;
  }
  #picker.show { opacity: 1; pointer-events: auto; transform: scale(1); }
  #picker .btn { width: 130px; height: 100px; }
  #confirm {
    position: fixed; inset: 0; background: rgba(20,30,50,.6); display: none;
    align-items: center; justify-content: center; gap: 60px; z-index: 10;
  }
  #confirm.show { display: flex; }
  #confirm .btn { width: 170px; height: 170px; border-radius: 40px; }
  #confirm .yes { background: #ff8a8a; }
  #confirm .no { background: #8fe08a; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="world"></canvas>
    <div id="picker"></div>
  </div>
  <div id="bar"></div>
</div>
<div id="confirm">
  <button class="btn no" data-act="keep"><canvas></canvas></button>
  <button class="btn yes" data-act="wipe"><canvas></canvas></button>
</div>
<script>
'use strict';
/* =====================================================================
   Ayman's Trains - a no-text, no-score train set for little hands.
   Everything (art + sound) is drawn/generated here. No libraries.
   ===================================================================== */

// ---------- constants ----------
const COLS = 16, ROWS = 11;
const N = 1, E = 2, S = 4, W = 8;
const DIRS = [N, E, S, W];
const DX = { 1: 0, 2: 1, 4: 0, 8: -1 };
const DY = { 1: -1, 2: 0, 4: 1, 8: 0 };
const OPP = { 1: 4, 2: 8, 4: 1, 8: 2 };
const SAVE_KEY = 'ayman-trains-v1';
const TAU = Math.PI * 2;

const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const inGrid = (r, c) => r >= 0 && r < ROWS && c >= 0 && c < COLS;
const bits = m => (m & 1) + ((m >> 1) & 1) + ((m >> 2) & 1) + ((m >> 3) & 1);

// ---------- world state ----------
// cell: { g: 'grass'|'water'|'road'|'rbridge', t: null|edge-mask, o: null|object, b: rail bridge, sw: switch, v: variant }
let world = null;

function newCell(g) { return { g, t: null, o: null, b: 0, sw: 0, v: Math.floor(Math.random() * 4) }; }
function cell(r, c) { return inGrid(r, c) ? world.cells[r * COLS + c] : null; }

function makeTerrain() {
  const cells = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) cells.push(newCell('grass'));
  const at = (r, c) => cells[r * COLS + c];
  // a wiggly river running top to bottom
  for (let r = 0; r < ROWS; r++) {
    const x = 10 + Math.round(Math.sin(r * 0.6) * 1.2);
    at(r, x).g = 'water'; at(r, x + 1).g = 'water';
  }
  // a long road across, with its own road bridge, and a road going up
  for (let c = 0; c < COLS; c++) { const k = at(8, c); k.g = k.g === 'water' ? 'rbridge' : 'road'; }
  for (let r = 0; r < 8; r++) at(r, 2).g = 'road';
  for (let r = 9; r < ROWS; r++) at(r, 14).g = 'road';
  return cells;
}

function freshWorld(withStarter) {
  world = { cells: makeTerrain(), trains: [], time: 8, nextId: 1 };
  if (withStarter) buildStarter();
}

function buildStarter() {
  buildDecor();
  // a little loop with (later) a yard, a station and a steam engine so something moves straight away
  const loop = [];
  for (let c = 4; c <= 7; c++) loop.push([1, c]);
  for (let r = 2; r <= 5; r++) loop.push([r, 7]);
  for (let c = 6; c >= 4; c--) loop.push([5, c]);
  for (let r = 4; r >= 1; r--) loop.push([r, 4]);
  for (let i = 0; i < loop.length - 1; i++) link(loop[i][0], loop[i][1], loop[i + 1][0], loop[i + 1][1]);
  starterExtras();
}

function starterExtras() {
  cell(1, 5).o = 'yard'; cell(1, 6).o = 'yard';
  cell(5, 5).o = 'station'; cell(5, 6).o = 'station';
  cell(3, 5).o = 'tree'; cell(2, 6).o = 'tree';
  const t = placeTrain('steam', 3, 4);
  if (t) { t.segs = [{ r: 3, c: 4, a: S, b: N }]; t.h = 0.5; buildTrailBack(t); }
}

function buildDecor() {
  // a few houses and trees for decoration
  [[9, 0], [10, 4], [6, 0], [10, 7], [1, 14], [4, 15]].forEach(([r, c], i) => { const k = cell(r, c); if (k.g === 'grass') { k.o = 'house'; k.v = i % 4; } });
  [[0, 0], [1, 1], [10, 0], [9, 6], [0, 8], [10, 13], [6, 15], [9, 15], [0, 13], [5, 13]].forEach(([r, c]) => { const k = cell(r, c); if (k.g === 'grass' && !k.o) k.o = 'tree'; });
}

// ---------- track topology ----------
// A cell's track is a mask of the edges it links to. The pieces (lanes a train
// can drive) are derived from it, so tracks snap together on their own:
//   0 links: a lone straight, 1: straight to a buffer stop, 2: straight or curve,
//   3: a switch (straight + two curves), 4: a crossing.
function pieces(m) {
  const n = bits(m);
  if (n === 0) return [[W, E]];
  if (n === 1) return [[m, OPP[m]]];
  if (n === 2) { const [a, b] = DIRS.filter(d => m & d); return [[a, b]]; }
  if (n === 3) {
    const x = (m & N) && (m & S) ? N : E, y = OPP[x], c = DIRS.find(d => (m & d) && d !== x && d !== y);
    return [[x, y], [x, c], [y, c]];
  }
  return [[N, S], [E, W]];
}
function exitsFrom(m, entry) {
  const out = [];
  for (const [a, b] of pieces(m)) { if (a === entry) out.push(b); else if (b === entry) out.push(a); }
  return out;
}
function hasPiece(m, a, b) { return pieces(m).some(([x, y]) => (x === a && y === b) || (x === b && y === a)); }
// can a train leave cell (r,c) through edge d into the neighbour?
function connected(r, c, d) {
  const k = cell(r, c), n = cell(r + DY[d], c + DX[d]);
  return !!(k && n && k.t !== null && n.t !== null && (k.t & d) && (n.t & OPP[d]));
}
function canTrack(k) { return k && (k.g === 'grass' || k.g === 'road' || k.g === 'water') && k.o !== 'tree' && k.o !== 'house'; }
function putTrack(k) { if (k.t === null) k.t = 0; if (k.g === 'water') k.b = 1; }

function link(r1, c1, r2, c2) {
  const a = cell(r1, c1), b = cell(r2, c2);
  if (!canTrack(a) || !canTrack(b)) return false;
  let d = 0;
  for (const dd of DIRS) if (r1 + DY[dd] === r2 && c1 + DX[dd] === c2) d = dd;
  if (!d) return false;
  putTrack(a); putTrack(b);
  if ((a.t & d) && (b.t & OPP[d])) return false;
  a.t |= d; b.t |= OPP[d];
  return true;
}

// tapping an empty spot lays one piece that joins up with loose ends next to it
function tapTrack(r, c) {
  const k = cell(r, c);
  if (!canTrack(k)) return false;
  if (k.t !== null && bits(k.t) >= 2) return false;
  const was = k.t;
  putTrack(k);
  const cands = DIRS.map(d => ({ d, n: cell(r + DY[d], c + DX[d]) }))
    .filter(o => o.n && o.n.t !== null && !(k.t & o.d) && bits(o.n.t) < 2)
    .sort((p, q) => {
      // prefer neighbours whose loose end points at us
      const pp = p.n.t === OPP[OPP[p.d]] ? 0 : 1, qq = q.n.t === OPP[OPP[q.d]] ? 0 : 1;
      return pp - qq;
    });
  for (const o of cands) { if (bits(k.t) >= 2) break; link(r, c, r + DY[o.d], c + DX[o.d]); }
  return was === null || k.t !== was;
}

function eraseCell(r, c) {
  const k = cell(r, c);
  if (!k) return false;
  if (k.o) { k.o = null; return 'obj'; }
  if (k.t !== null) {
    if (trainOnCell(r, c)) return 'busy';
    for (const d of DIRS) if (k.t & d) { const n = cell(r + DY[d], c + DX[d]); if (n && n.t !== null) n.t &= ~OPP[d]; }
    k.t = null; k.sw = 0;
    return 'track';
  }
  if (k.b) { k.b = 0; return 'obj'; }
  return false;
}
function trainOnCell(r, c) { return false; }

// geometry of a piece inside a cell, in cell units (0..1). f is 0..1 along a->b.
const EDGE_PT = { 1: [0.5, 0], 2: [1, 0.5], 4: [0.5, 1], 8: [0, 0.5] };
const CORNER = { 3: [1, 0], 6: [1, 1], 12: [0, 1], 9: [0, 0] }; // N|E, E|S, S|W, W|N
function pieceLen(a, b) { return OPP[a] === b ? 1 : Math.PI / 4; }
function piecePoint(a, b, f) {
  const p = EDGE_PT[a], q = EDGE_PT[b];
  if (OPP[a] === b) return [p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f];
  const cn = CORNER[a | b];
  const a0 = Math.atan2(p[1] - cn[1], p[0] - cn[0]);
  let a1 = Math.atan2(q[1] - cn[1], q[0] - cn[0]);
  let da = a1 - a0; while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
  const ang = a0 + da * f;
  return [cn[0] + Math.cos(ang) * 0.5, cn[1] + Math.sin(ang) * 0.5];
}
function pieceDir(a, b, f) {
  const p = piecePoint(a, b, Math.max(0, f - 0.01)), q = piecePoint(a, b, Math.min(1, f + 0.01));
  const dx = q[0] - p[0], dy = q[1] - p[1], l = Math.hypot(dx, dy) || 1;
  return [dx / l, dy / l];
}

// ---------- layout / view ----------
const stage = document.getElementById('stage');
const cv = document.getElementById('world');
const ctx = cv.getContext('2d');
let DPR = 1, VW = 0, VH = 0, CS = 40, OX = 0, OY = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = stage.clientWidth; VH = stage.clientHeight;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  CS = Math.floor(Math.min(VW / COLS, VH / ROWS));
  OX = Math.floor((VW - CS * COLS) / 2); OY = Math.floor((VH - CS * ROWS) / 2);
  baseDirty = true;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

// ---------- drawing helpers ----------
function rrect(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function circle(g, x, y, r, fill) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fillStyle = fill; g.fill(); }

// cached base layer (terrain etc.)
let baseCanvas = document.createElement('canvas'), baseDirty = true;

function drawTerrainCell(g, r, c, x, y, s) {
  const k = cell(r, c);
  // grass with a soft checker
  g.fillStyle = (r + c) % 2 ? '#7fcf6a' : '#78c964';
  g.fillRect(x, y, s + 0.5, s + 0.5);
  if (k.g === 'water' || k.g === 'rbridge') {
    g.fillStyle = '#4fb3f0';
    g.fillRect(x, y, s + 0.5, s + 0.5);
    // sandy banks where land touches water
    g.fillStyle = '#f2d98d';
    const land = (rr, cc) => { const n = cell(rr, cc); return n && n.g !== 'water' && n.g !== 'rbridge'; };
    const b = s * 0.12;
    if (land(r - 1, c)) g.fillRect(x, y, s, b);
    if (land(r + 1, c)) g.fillRect(x, y + s - b, s, b);
    if (land(r, c - 1)) g.fillRect(x, y, b, s);
    if (land(r, c + 1)) g.fillRect(x + s - b, y, b, s);
  }
  if (k.g === 'road' || k.g === 'rbridge') drawRoad(g, r, c, x, y, s);
}

function roadMask(r, c) {
  let m = 0;
  for (const d of DIRS) { const n = cell(r + DY[d], c + DX[d]); if (n && (n.g === 'road' || n.g === 'rbridge')) m |= d; }
  if (m === 0) m = E | W;
  if (m === N || m === S) m = N | S;
  if (m === E || m === W) m = E | W;
  return m;
}

function drawRoad(g, r, c, x, y, s) {
  const k = cell(r, c), m = roadMask(r, c), w = s * 0.7, o = (s - w) / 2;
  if (k.g === 'rbridge') { // stone deck + rails
    g.fillStyle = '#b9a58a'; g.fillRect(x, y + o - s * 0.1, s, w + s * 0.2);
  }
  g.fillStyle = '#6b6f78';
  g.fillRect(x + o, y + o, w, w);
  if (m & N) g.fillRect(x + o, y, w, o + 1);
  if (m & S) g.fillRect(x + o, y + o + w - 1, w, o + 1);
  if (m & W) g.fillRect(x, y + o, o + 1, w);
  if (m & E) g.fillRect(x + o + w - 1, y + o, o + 1, w);
  // dashed middle line
  g.strokeStyle = '#ffe680'; g.lineWidth = Math.max(2, s * 0.05); g.setLineDash([s * 0.14, s * 0.12]);
  g.beginPath();
  if (m & N) { g.moveTo(x + s / 2, y); g.lineTo(x + s / 2, y + s / 2); }
  if (m & S) { g.moveTo(x + s / 2, y + s / 2); g.lineTo(x + s / 2, y + s); }
  if (m & W) { g.moveTo(x, y + s / 2); g.lineTo(x + s / 2, y + s / 2); }
  if (m & E) { g.moveTo(x + s / 2, y + s / 2); g.lineTo(x + s, y + s / 2); }
  g.stroke(); g.setLineDash([]);
}

function renderBase() {
  baseCanvas.width = cv.width; baseCanvas.height = cv.height;
  const g = baseCanvas.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#5aa84f'; g.fillRect(0, 0, VW, VH);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) drawTerrainCell(g, r, c, OX + c * CS, OY + r * CS, CS);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) drawCellContents(g, r, c, OX + c * CS, OY + r * CS, CS);
  // things that sit on top of trains: tunnel hills and train-yard sheds
  topCanvas.width = cv.width; topCanvas.height = cv.height;
  const tg = topCanvas.getContext('2d');
  tg.setTransform(DPR, 0, 0, DPR, 0, 0);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (cell(r, c).o === 'tunnel') drawTunnel(tg, r, c, OX + c * CS, OY + r * CS, CS);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (cell(r, c).o === 'yard') drawShed(tg, r, c, OX + c * CS, OY + r * CS, CS);
  baseDirty = false;
}
const topCanvas = document.createElement('canvas');

// ---------- stations ----------
function touchedEdges(k) { return pieces(k.t === null ? 0 : k.t).reduce((m, [a, b]) => m | a | b, 0); }
function stationSide(k) { const t = touchedEdges(k); return [N, S, W, E].find(d => !(t & d)) || 0; }
function sideRect(d) {
  return d === N ? [0, 0, 1, 0.25] : d === S ? [0, 0.75, 1, 0.25] : d === W ? [0, 0, 0.25, 1] : [0.75, 0, 0.25, 1];
}
function drawStation(g, k, x, y, s) {
  const d = stationSide(k);
  if (!d) { circle(g, x + s * 0.12, y + s * 0.12, s * 0.1, '#1c7ed6'); return; }
  const [rx, ry, rw, rh] = sideRect(d);
  g.fillStyle = 'rgba(0,0,0,.15)'; g.fillRect(x + rx * s + 2, y + ry * s + 3, rw * s, rh * s);
  g.fillStyle = '#e9ecef'; g.fillRect(x + rx * s, y + ry * s, rw * s, rh * s);
  // yellow safety line on the track side
  g.fillStyle = '#fcc419';
  const lw = s * 0.035;
  if (d === N) g.fillRect(x + rx * s, y + (ry + rh) * s - lw, rw * s, lw);
  if (d === S) g.fillRect(x + rx * s, y + ry * s, rw * s, lw);
  if (d === W) g.fillRect(x + (rx + rw) * s - lw, y + ry * s, lw, rh * s);
  if (d === E) g.fillRect(x + rx * s, y + ry * s, lw, rh * s);
  // a lamp post and a bench
  circle(g, x + (rx + rw * (d === N || d === S ? 0.05 : 0.5)) * s, y + (ry + rh * (d === N || d === S ? 0.5 : 0.05)) * s, s * 0.05, '#1c7ed6');
}

const stationState = new Map();
function stState(idx) {
  let st = stationState.get(idx);
  if (!st) { st = { n: 3, hop: 0, refill: 0, boarding: [] }; stationState.set(idx, st); }
  return st;
}
function personSpot(idx, i) {
  const r = Math.floor(idx / COLS), c = idx % COLS, k = world.cells[idx], d = stationSide(k);
  if (!d) return [c + 0.12, r + 0.12];
  const [rx, ry, rw, rh] = sideRect(d), f = 0.2 + (i % 3) * 0.3 + (i >= 3 ? 0.15 : 0);
  return d === N || d === S ? [c + rx + rw * f, r + ry + rh / 2] : [c + rx + rw / 2, r + ry + rh * f];
}
const PEOPLE_COLS = ['#f03e3e', '#7048e8', '#f59f00', '#12b886', '#e64980', '#1c7ed6'];
const SKIN = ['#f1c27d', '#c68642', '#8d5524', '#ffdbac'];
function drawPerson(x, y, i, lift) {
  const r = CS * 0.08;
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.arc(x + 1, y + 2, r * 1.3, 0, TAU); ctx.fill();
  const yy = y - lift * CS * 0.25, sc = 1 + lift * 0.4;
  circle(ctx, x, yy, r * 1.3 * sc, PEOPLE_COLS[i % PEOPLE_COLS.length]);
  circle(ctx, x, yy, r * 0.8 * sc, SKIN[i % SKIN.length]);
}
function updateStations(dt) {
  for (const [idx, st] of stationState) {
    if (world.cells[idx].o !== 'station') { stationState.delete(idx); continue; }
    if (st.hop > 0) st.hop -= dt;
    if (st.n < 4) { st.refill += dt; if (st.refill > 3.5) { st.refill = 0; st.n++; } }
    for (const b of st.boarding) b.t += dt * 2.2;
    st.boarding = st.boarding.filter(b => b.t < 1);
  }
}
function drawStationPeople() {
  world.cells.forEach((k, idx) => {
    if (k.o !== 'station') return;
    const st = stState(idx);
    for (let i = 0; i < st.n; i++) {
      const [px, py] = personSpot(idx, i);
      const lift = st.hop > 0 ? Math.abs(Math.sin((st.hop + i * 0.12) * 9)) : 0;
      drawPerson(OX + px * CS, OY + py * CS, i + idx, lift);
    }
    for (const b of st.boarding) {
      const x = b.x0 + (b.x1 - b.x0) * b.t, y = b.y0 + (b.y1 - b.y0) * b.t;
      ctx.globalAlpha = 1 - b.t * b.t;
      drawPerson(OX + x * CS, OY + y * CS, b.i, Math.sin(b.t * Math.PI));
      ctx.globalAlpha = 1;
    }
  });
}
// everyone on the platform hops onto the train standing at the station
function boardTrain(idx, t) {
  const st = stState(idx), r = Math.floor(idx / COLS), c = idx % COLS;
  if (!st.n) return false;
  const tx = c + 0.5, ty = r + 0.5;
  for (let i = 0; i < st.n; i++) { const [px, py] = personSpot(idx, i); st.boarding.push({ x0: px, y0: py, x1: tx, y1: ty, t: -i * 0.25, i: i + idx }); }
  st.n = 0; st.refill = -2;

// ---------- main loop ----------
let last = performance.now(), T = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  update(dt);
  draw();

}

function update(dt) {
  updateTrains(dt);
  updateStations(dt);
  saveTimer += dt;
  if (saveTimer > 4) { saveTimer = 0; save(); }
}

function draw() {
  if (baseDirty) renderBase();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(baseCanvas, 0, 0);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawWaterSparkles();
  for (const t of world.trains) if (t.poses) drawTrain(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(topCanvas, 0, 0);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  drawPuffs();

}

function drawWaterSparkles() {
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = Math.max(1.5, CS * 0.04); ctx.lineCap = 'round';
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const k = cell(r, c);
    if (k.g !== 'water' || k.b) continue;
    const ph = T * 1.2 + r * 0.9 + c * 1.7;
    const x = OX + c * CS + CS * (0.3 + 0.15 * Math.sin(ph)), y = OY + r * CS + CS * (0.35 + ((r + c) % 2) * 0.3);

// =====================================================================
// TRAINS
// =====================================================================
const TRAINS = {
  commuter: { cars: ['cab', 'mid', 'cab'], len: 0.86, speed: 1.7 },
  subway: { cars: ['cab', 'mid', 'cab'], len: 0.86, speed: 1.9 },
  streetcar: { cars: ['cab', 'cab'], len: 0.78, speed: 1.2 },
  freight: { cars: ['loco', 'box', 'tank', 'logs'], len: 0.8, speed: 1.3 },
  steam: { cars: ['loco', 'tender', 'coach', 'coach'], len: 0.8, speed: 1.4 },

const TYPES = ['commuter', 'subway', 'streetcar', 'freight', 'steam'];
const GAP = 0.07;

function makeTrain(type) {
  const spec = TRAINS[type];
  const cars = spec.cars.map((kind, i) => ({ kind, flip: kind === 'cab' && i === spec.cars.length - 1 && i > 0 }));
  return {
    id: world.nextId++, type, segs: [], h: 0, cars, v: 0, state: 'run',
    wait: 0, blocked: 0, stuck: 0, ghost: 0, honkT: 0, parkD: 0, out: Infinity, lastStop: -1, smoke: 0, wakeDelay: 0,
  };
}
const carLen = t => TRAINS[t.type].len;
const trainLen = t => t.cars.length * (carLen(t) + GAP);
const segLen = s => pieceLen(s.a, s.b);
function segPt(s, d) { const p = piecePoint(s.a, s.b, clamp(d / segLen(s), 0, 1)); return [s.c + p[0], s.r + p[1]]; }

// point at distance `dist` behind the front of the train (in cell units), or null if off the trail
function locate(t, dist) {
  let rem = dist;
  if (rem <= t.h) return segPt(t.segs[0], t.h - rem);
  rem -= t.h;
  for (let k = 1; k < t.segs.length; k++) {
    const L = segLen(t.segs[k]);
    if (rem <= L) return segPt(t.segs[k], L - rem);
    rem -= L;
  }
  return null;
}

// build the track behind a freshly placed train so its wagons sit on real rails
function buildTrailBack(t) {
  const need = trainLen(t) + 0.5;
  let have = t.h, s = t.segs[t.segs.length - 1], guard = 0;
  while (have < need && guard++ < 30) {
    if (!connected(s.r, s.c, s.a)) break;
    const pr = s.r + DY[s.a], pc = s.c + DX[s.a], k = cell(pr, pc);
    const ex = exitsFrom(k.t, OPP[s.a]);
    if (!ex.length) break;
    const prev = { r: pr, c: pc, a: ex[0], b: OPP[s.a] };
    t.segs.push(prev); have += segLen(prev); s = prev;
  }

function placeTrain(type, r, c) {
  const k = cell(r, c);
  if (!k || k.t === null) return false;
  if (trainOnCell(r, c)) return false;
  const t = makeTrain(type);
  const ps = pieces(k.t);
  let [a, b] = ps[0];
  // prefer heading towards connected track
  if (!connected(r, c, b) && connected(r, c, a)) [a, b] = [b, a];
  else if (Math.random() < 0.5 && connected(r, c, a)) [a, b] = [b, a];
  t.segs = [{ r, c, a, b }];
  t.h = pieceLen(a, b) * 0.6;
  buildTrailBack(t);
  t.v = 0.3;
  if (isNight()) { t.state = 'home'; }

  return t;
}

function reverseTrain(t) {
  const total = trainLen(t);
  let k = 0, pos;
  if (total <= t.h) pos = t.h - total;
  else {
    let rem = total - t.h; k = 1;
    while (k < t.segs.length && rem > segLen(t.segs[k])) { rem -= segLen(t.segs[k]); k++; }
    if (k >= t.segs.length) { k = t.segs.length - 1; pos = 0; }
    else pos = segLen(t.segs[k]) - rem;
  }
  const L = segLen(t.segs[k]);
  t.segs = t.segs.slice(0, k + 1).reverse().map(s => ({ r: s.r, c: s.c, a: s.b, b: s.a }));
  t.h = L - pos;
  t.cars.reverse(); t.cars.forEach(c => { c.flip = !c.flip; });
  t.blocked = 0; t.v = 0;
}

function trimTrail(t) {
  let have = t.h;

  for (let k = 1; k < t.segs.length; k++) {
    if (have >= need) { t.segs.length = k; return; }
    have += segLen(t.segs[k]);
  }
}

function chooseExit(t, r, c, entry, ex) {
  if (ex.length === 1) return ex[0];
  if (t.state === 'home') { const b = routeExit(r, c, entry, ex); if (b) return b; }
  const k = cell(r, c);
  const b = ex[k.sw % ex.length];
  k.sw = (k.sw + 1) % 2; // switches take turns so trains visit everything
  return b;
}
function routeExit(r, c, entry, ex) { return null; }

// move the front of the train forward; returns false if it hit a buffer stop
function advance(t, dist) {
  t.h += dist;
  let guard = 0;
  while (guard++ < 8) {
    const s0 = t.segs[0], L = segLen(s0);
    const dead = !connected(s0.r, s0.c, s0.b);
    const lim = dead ? L - 0.16 : L;
    if (t.h < lim) break;
    if (dead) { t.h = lim; return false; }
    const nr = s0.r + DY[s0.b], nc = s0.c + DX[s0.b], entry = OPP[s0.b];
    const k = cell(nr, nc), ex = exitsFrom(k.t, entry);
    if (!ex.length) { t.h = lim; return false; }
    const b = chooseExit(t, nr, nc, entry, ex);
    t.segs.unshift({ r: nr, c: nc, a: entry, b });
    t.h -= L;
  }
  trimTrail(t);
  return true;
}

// keep trains valid when the track under them changes
function validateTrains() {
  for (const t of world.trains) {
    for (let i = 0; i < t.segs.length; i++) {
      const s = t.segs[i], k = cell(s.r, s.c);
      if (!k || k.t === null) { t.segs.length = Math.max(1, i); break; }
      if (hasPiece(k.t, s.a, s.b)) continue;
      const fromA = exitsFrom(k.t, s.a), fromB = exitsFrom(k.t, s.b);
      if (fromA.length) s.b = fromA[0];
      else if (fromB.length) s.a = fromB[0];
      else [s.a, s.b] = pieces(k.t)[0];
    }
    if (cell(t.segs[0].r, t.segs[0].c).t === null) { t.dead = true; continue; }
    t.h = Math.min(t.h, segLen(t.segs[0]));
  }
  world.trains = world.trains.filter(t => !t.dead);
}

function trainOnCell(r, c) {
  return world.trains.some(t => t.segs.some((s, i) => s.r === r && s.c === c && (i === 0 || !(t.state === 'sleep' && t.parkD > 0))));
}

// compute the visible cars' positions (cell units) for drawing and tapping
function carPoses(t) {
  const L = carLen(t), sp = L + GAP, out = [];
  for (let i = 0; i < t.cars.length; i++) {
    // parking: the front stays at the shed's middle and the wagons slide in after it.
    // waking: wagons only appear once the front has driven far enough out of the shed.
    const front = i * sp - t.parkD, back = front + L, mid = front + L / 2;
    if (mid < 0 || mid + t.parkD > t.out) { out.push(null); continue; } // inside the shed
    const pf = locate(t, Math.max(0, front + L * 0.15)), pb = locate(t, Math.max(0, back - L * 0.15));
    if (!pf || !pb) { out.push(null); continue; }
    let ang = Math.atan2(pf[1] - pb[1], pf[0] - pb[0]);
    if (t.cars[i].flip) ang += Math.PI;
    out.push({ x: (pf[0] + pb[0]) / 2, y: (pf[1] + pb[1]) / 2, ang, car: t.cars[i], i });
  }
  return out;
}

function updateTrains(dt) {
  // positions for collision checks
  for (const t of world.trains) t.poses = carPoses(t);
  for (const t of world.trains) {
    if (t.honkT > 0) t.honkT -= dt;
    if (t.ghost > 0) t.ghost -= dt;
    trainBrain(t, dt);
    const spec = TRAINS[t.type];
    let target = t.state === 'run' || t.state === 'home' || t.state === 'wake' ? spec.speed : 0;
    if (t.wait > 0) { t.wait -= dt; target = 0; }
    // gentle waiting behind other trains
    if (target > 0 && t.ghost <= 0 && pathBlocked(t)) {

      if (t.blocked > 3 + (t.id % 5) * 0.4) onBlocked(t);
    } else t.blocked = 0;
    const acc = target > t.v ? 1.6 : 3.2;
    t.v += clamp(target - t.v, -acc * dt, acc * dt);
    if (t.v > 0.001) {
      if (!advance(t, t.v * dt)) { onBufferStop(t); }
      t.stuck = 0;
    } else if (target === 0 && t.blocked > 0) {
      t.stuck += dt;
      if (t.stuck > 9) { t.ghost = 3; t.stuck = 0; } // never stay stuck forever
    }
    if (t.type === 'steam' && t.v > 0.2 && t.poses[0]) {
      t.smoke -= dt;
      if (t.smoke <= 0) { t.smoke = 0.28; const p = t.poses.find(Boolean); if (p && p.car.kind === 'loco') addPuff(p); }

function onBufferStop(t) { reverseTrain(t); }
function onBlocked(t) { reverseTrain(t); }
function trainBrain(t, dt) {
  const s0 = t.segs[0], k = cell(s0.r, s0.c), idx = s0.r * COLS + s0.c;
  if (t.lastStop !== idx) { if (k.o !== 'station') t.lastStop = -1; }
  // stop at stations in the daytime and let people hop on
  if (t.state === 'run' && k.o === 'station' && t.lastStop !== idx && t.h >= segLen(s0) * 0.5 && t.poses && t.poses[0]) {
    t.lastStop = idx; t.wait = 2.6;
    sfx('chime', 84);
    setTimeout(() => { if (boardTrain(idx, t)) sfx('hop'); }, 600);
  }
}
function isNight() { return false; }

function headInfo(t) {
  const s = t.segs[0], L = segLen(s), f = clamp(t.h / L, 0, 1);
  const p = piecePoint(s.a, s.b, f), d = pieceDir(s.a, s.b, f);
  return { x: s.c + p[0], y: s.r + p[1], dx: d[0], dy: d[1] };
}

function pathBlocked(t) {
  const h = headInfo(t);
  const lx = h.x + h.dx * 0.42, ly = h.y + h.dy * 0.42;
  for (const o of world.trains) {
    if (o === t || o.ghost > 0) continue;
    for (const p of o.poses) {
      if (!p) continue;
      const dx = p.x - lx, dy = p.y - ly;
      if (dx * dx + dy * dy < 0.5 * 0.5 && (p.x - h.x) * h.dx + (p.y - h.y) * h.dy > 0) return true;
    }
  }
  return false;
}

// ---------- smoke puffs & sparkles ----------
const puffs = [];
function addPuff(p) {
  const fx = Math.cos(p.ang), fy = Math.sin(p.ang);
  puffs.push({ x: p.x + fx * 0.28, y: p.y + fy * 0.28, r: 0.1, life: 1.6, max: 1.6, vx: rnd(-0.1, 0.1), vy: rnd(-0.35, -0.2), col: 'rgba(240,240,245,' });
}
function updatePuffs(dt) {
  for (const p of puffs) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += dt * 0.18; }
  for (let i = puffs.length - 1; i >= 0; i--) if (puffs[i].life <= 0) puffs.splice(i, 1);
}
function drawPuffs() {
  for (const p of puffs) {
    const a = clamp(p.life / p.max, 0, 1) * 0.8;
    ctx.fillStyle = p.col + a + ')';
    ctx.beginPath(); ctx.arc(OX + p.x * CS, OY + p.y * CS, p.r * CS, 0, TAU); ctx.fill();
  }
}

// ---------- train art (top-down, +x is the front of the car) ----------
function drawTrain(t) {
  const L = carLen(t) * CS, Wd = CS * 0.46;
  const honk = t.honkT > 0 ? t.honkT : 0;
  for (let i = t.poses.length - 1; i >= 0; i--) {
    const p = t.poses[i];
    if (!p) continue;
    ctx.save();
    ctx.translate(OX + p.x * CS, OY + p.y * CS);
    ctx.rotate(p.ang);
    if (honk) { const s = 1 + 0.06 * Math.abs(Math.sin(honk * 14)); ctx.scale(s, s); }
    drawCar(ctx, t.type, p.car.kind, L, Wd);
    ctx.restore();
  }
}

function drawCar(g, type, kind, L, Wd) {
  const hl = L / 2, hw = Wd / 2;
  g.fillStyle = 'rgba(0,0,0,.22)';
  rrect(g, -hl + Wd * 0.12, -hw + Wd * 0.18, L, Wd, Wd * 0.3); g.fill();
  const body = (fill, rad) => { g.fillStyle = fill; rrect(g, -hl, -hw, L, Wd, rad == null ? Wd * 0.3 : rad); g.fill(); };
  const winRow = (col, n, inset) => {
    g.fillStyle = col;
    const step = L * 0.8 / n;
    for (let j = 0; j < n; j++) {
      const x = -L * 0.4 + step * j + step * 0.15;
      g.fillRect(x, -hw + inset, step * 0.7, Wd * 0.1);
      g.fillRect(x, hw - inset - Wd * 0.1, step * 0.7, Wd * 0.1);
    }
  };
  if (type === 'commuter' || type === 'subway') {
    const main = type === 'commuter' ? '#f8f9fa' : '#e03131';
    const trim = type === 'commuter' ? '#2f9e44' : '#f1f3f5';
    body(main);
    g.fillStyle = trim; g.fillRect(-hl + Wd * 0.2, -hw + Wd * 0.06, L - Wd * 0.4, Wd * 0.1); g.fillRect(-hl + Wd * 0.2, hw - Wd * 0.16, L - Wd * 0.4, Wd * 0.1);
    g.fillStyle = type === 'commuter' ? '#dee2e6' : '#adb5bd'; rrect(g, -hl + Wd * 0.25, -hw * 0.45, L - Wd * 0.5, hw * 0.9, Wd * 0.1); g.fill();
    winRow(type === 'commuter' ? '#4dabf7' : '#343a40', 4, Wd * 0.2);
    if (kind === 'cab') {
      g.fillStyle = type === 'commuter' ? '#2f9e44' : '#c92a2a';
      rrect(g, hl - L * 0.24, -hw, L * 0.24, Wd, Wd * 0.3); g.fill();
      g.fillStyle = '#1c2a3a'; rrect(g, hl - L * 0.16, -hw * 0.7, L * 0.1, hw * 1.4, 3); g.fill();
      g.fillStyle = '#ffe066'; circle(g, hl - 3, -hw * 0.6, Wd * 0.07, '#ffe066'); circle(g, hl - 3, hw * 0.6, Wd * 0.07, '#ffe066');
    }
  } else if (type === 'streetcar') {
    body('#e03131', Wd * 0.45);
    g.fillStyle = '#fff3bf'; rrect(g, -hl + Wd * 0.15, -hw * 0.6, L - Wd * 0.3, hw * 1.2, Wd * 0.25); g.fill();
    winRow('#4dabf7', 3, Wd * 0.06);
    // pantograph
    g.strokeStyle = '#343a40'; g.lineWidth = Math.max(1.5, Wd * 0.06);
    g.beginPath(); g.moveTo(-L * 0.12, 0); g.lineTo(0, -hw * 0.45); g.lineTo(L * 0.12, 0); g.lineTo(0, hw * 0.45); g.closePath(); g.stroke();
    if (kind === 'cab') {
      g.fillStyle = '#1c2a3a'; rrect(g, hl - L * 0.13, -hw * 0.65, L * 0.08, hw * 1.3, 3); g.fill();
      circle(g, hl - 3, 0, Wd * 0.08, '#ffe066');
    }
  } else if (type === 'freight') {
    if (kind === 'loco') {
      body('#f59f00');
      g.fillStyle = '#1864ab'; rrect(g, hl - L * 0.38, -hw, L * 0.28, Wd, 4); g.fill();
      g.fillStyle = '#e8590c'; rrect(g, -hl + Wd * 0.1, -hw * 0.5, L * 0.5, hw, 4); g.fill();
      g.fillStyle = '#212529'; circle(g, -L * 0.05, 0, Wd * 0.12, '#495057');
      g.fillStyle = '#fff'; for (let j = 0; j < 3; j++) g.fillRect(-hl + Wd * 0.15 + j * L * 0.13, -hw + 2, L * 0.05, Wd - 4);
      circle(g, hl - 3, 0, Wd * 0.08, '#ffe066');
    } else if (kind === 'box') {
      body('#b5651d', Wd * 0.12);
      g.strokeStyle = '#8b4513'; g.lineWidth = 2;
      for (let j = 1; j < 6; j++) { const x = -hl + L * j / 6; g.beginPath(); g.moveTo(x, -hw + 2); g.lineTo(x, hw - 2); g.stroke(); }
    } else if (kind === 'tank') {
      g.fillStyle = '#495057'; rrect(g, -hl, -hw * 0.8, L, Wd * 0.8, 3); g.fill();
      body('#4dabf7', hw);
      g.fillStyle = 'rgba(255,255,255,.45)'; rrect(g, -hl + Wd * 0.3, -hw * 0.55, L - Wd * 0.6, hw * 0.35, 4); g.fill();
      circle(g, 0, 0, Wd * 0.14, '#1971c2');
    } else { // logs
      body('#495057', Wd * 0.1);
      const cols = ['#a0522d', '#8b5a2b', '#b8733a'];
      for (let j = 0; j < 3; j++) { g.fillStyle = cols[j]; rrect(g, -hl + 3, -hw * 0.8 + j * hw * 0.55, L - 6, hw * 0.5, hw * 0.25); g.fill(); }
    }
  } else { // steam
    if (kind === 'loco') {
      body('#212529', Wd * 0.25);
      g.fillStyle = '#343a40'; rrect(g, -hl + L * 0.32, -hw * 0.7, L * 0.62, hw * 1.4, hw * 0.7); g.fill(); // boiler
      g.fillStyle = '#fab005'; for (const x of [0.45, 0.7]) g.fillRect(-hl + L * x, -hw * 0.7, L * 0.04, hw * 1.4);
      circle(g, -hl + L * 0.58, 0, Wd * 0.13, '#fab005'); // dome
      circle(g, hl - L * 0.14, 0, Wd * 0.14, '#111'); // chimney
      circle(g, hl - L * 0.14, 0, Wd * 0.08, '#495057');
      g.fillStyle = '#c92a2a'; rrect(g, -hl, -hw, L * 0.32, Wd, Wd * 0.2); g.fill(); // cab
      g.fillStyle = '#212529'; rrect(g, -hl + 3, -hw + 3, L * 0.32 - 6, Wd - 6, 3); g.fill(); // cab roof
      g.fillStyle = '#c92a2a'; g.fillRect(hl - 4, -hw, 4, Wd); // buffer beam
      circle(g, hl - 2, 0, Wd * 0.08, '#ffe066');
    } else if (kind === 'tender') {
      body('#212529', Wd * 0.15);
      g.fillStyle = '#c92a2a'; g.fillRect(-hl, -hw, L, Wd * 0.08); g.fillRect(-hl, hw - Wd * 0.08, L, Wd * 0.08);
      for (let j = 0; j < 7; j++) circle(g, -L * 0.3 + (j % 4) * L * 0.18, (j < 4 ? -1 : 1) * hw * 0.3, Wd * 0.13, '#000');
    } else {
      body('#c92a2a', Wd * 0.2);
      g.fillStyle = '#fff3bf'; rrect(g, -hl + 3, -hw * 0.55, L - 6, hw * 1.1, hw * 0.4); g.fill();
      winRow('#ffd43b', 4, 1);
    }
  }
}

// ---------- save / load ----------
let saveTimer = 0;
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(serialize())); } catch (e) { /* private mode etc. */ }
}
function serialize() {
  return { v: 1, time: world.time, nextId: world.nextId, cells: world.cells.map(k => [k.g, k.t, k.o, k.b, k.sw, k.v]), trains: world.trains.map(serTrain) };
}
function deserialize(d) {
  world = {
    time: d.time || 8, nextId: d.nextId || 1,
    cells: d.cells.map(a => ({ g: a[0], t: a[1], o: a[2], b: a[3] || 0, sw: a[4] || 0, v: a[5] || 0 })),
    trains: [],
  };
  world.trains = (d.trains || []).map(deTrain).filter(Boolean);
}
function load() {
  try {
    const s = localStorage.getItem(SAVE_KEY);
    if (s) { const d = JSON.parse(s); if (d && d.v === 1 && d.cells && d.cells.length === COLS * ROWS) { deserialize(d); return true; } }
  } catch (e) { /* corrupt save: start fresh */ }
  return false;
}
function serTrain(t) {
  return { id: t.id, type: t.type, segs: t.segs.map(s => [s.r, s.c, s.a, s.b]), h: t.h, cars: t.cars.map(c => [c.kind, c.flip ? 1 : 0]), state: t.state, ls: t.lastStop };
}
function deTrain(o) {
  if (!o || !TRAINS[o.type] || !o.segs || !o.segs.length) return null;
  const t = makeTrain(o.type);
  t.id = o.id; t.h = o.h; t.state = o.state || 'run'; t.lastStop = o.ls || -1;
  t.segs = o.segs.map(a => ({ r: a[0], c: a[1], a: a[2], b: a[3] }));
  if (o.cars && o.cars.length) t.cars = o.cars.map(a => ({ kind: a[0], flip: !!a[1] }));
  if (t.state === 'park') t.state = 'sleep';
  if (t.state === 'wake') t.state = 'run';
  t.parkD = t.state === 'sleep' && cellIsYard(t.segs[0]) ? trainLen(t) + 1 : 0;
  return t;
}
function cellIsYard(s) { const k = cell(s.r, s.c); return !!(k && k.o === 'yard'); }

// ---------- undo ----------
const undoStack = [];
function pushUndo() {
  undoStack.push(JSON.stringify(serialize()));
  if (undoStack.length > 40) undoStack.shift();
}
function undo() {
  if (!undoStack.length) { sfx('boop'); return; }
  deserialize(JSON.parse(undoStack.pop()));
  baseDirty = true; saveSoon();
  for (const t of world.trains) t.poses = carPoses(t);
  sfx('undo');
}
function saveSoon() { saveTimer = Math.max(saveTimer, 3.5); }

// ---------- touch input ----------
let stroke = null;
function cellAt(px, py) {
  const c = Math.floor((px - OX) / CS), r = Math.floor((py - OY) / CS);
  return inGrid(r, c) ? { r, c } : null;
}
function localXY(e) { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; }

function changed() { // call before the first change of a stroke
  if (stroke && !stroke.snap) { stroke.snap = true; pushUndo(); }
  baseDirty = true; saveSoon();
  validateTrains();
}

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  unlockAudio();
  hidePicker();
  if (stroke) return; // one finger at a time
  const [px, py] = localXY(e);
  if (tool !== 'eraser' && tapTrainAt(px, py)) return;
  if (tool === 'eraser' && eraseTrainAt(px, py)) return;
  const at = cellAt(px, py);
  if (!at) return;
  stroke = { id: e.pointerId, r: at.r, c: at.c, moved: false, snap: false, done: new Set() };
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  if (PAINT_TOOLS.has(tool)) paintAt(at.r, at.c);
});

cv.addEventListener('pointermove', e => {
  if (!stroke || e.pointerId !== stroke.id) return;
  e.preventDefault();
  const [px, py] = localXY(e);
  // clamp into the grid so a drag that slips off the edge still works
  const c = clamp(Math.floor((px - OX) / CS), 0, COLS - 1), r = clamp(Math.floor((py - OY) / CS), 0, ROWS - 1);
  // walk cell-by-cell (no diagonal jumps) towards the finger
  let guard = 0;
  while ((stroke.r !== r || stroke.c !== c) && guard++ < 60) {
    const dr = r - stroke.r, dc = c - stroke.c;
    let nr = stroke.r, nc = stroke.c;
    if (Math.abs(dc) >= Math.abs(dr)) nc += Math.sign(dc); else nr += Math.sign(dr);
    stepTo(nr, nc);
  }
});

function endStroke(e) {
  if (!stroke || e.pointerId !== stroke.id) return;
  if (!stroke.moved) tapAt(stroke.r, stroke.c);
  stroke = null;
}
cv.addEventListener('pointerup', endStroke);
cv.addEventListener('pointercancel', e => { if (stroke && e.pointerId === stroke.id) stroke = null; });

function stepTo(nr, nc) {
  const pr = stroke.r, pc = stroke.c;
  stroke.r = nr; stroke.c = nc; stroke.moved = true;
  if (tool === 'track') {
    const a = cell(pr, pc), b = cell(nr, nc);
    if (canTrack(a) && canTrack(b)) {
      if (!stroke.snap) { stroke.snap = true; pushUndo(); }
      if (link(pr, pc, nr, nc)) { changed(); sfx('clack'); }
    } else if (!canTrack(b)) sfx('boop');
  } else if (PAINT_TOOLS.has(tool)) paintAt(nr, nc);
}

function tapAt(r, c) {
  const k = cell(r, c);
  if (tool !== 'eraser' && tapThingAt(r, c)) return;
  if (tool === 'track') {
    if (!canTrack(k)) { sfx('boop'); return; }
    if (!stroke.snap) { stroke.snap = true; pushUndo(); }
    if (tapTrack(r, c)) { changed(); sfx('clack'); }
    else { undoStack.pop(); sfx('tick'); }
  } else if (PLACE_TOOLS.has(tool)) placeAt(r, c);
}

// tools that act on every cell a finger passes over
const PAINT_TOOLS = new Set(['eraser', 'tree', 'house', 'bridge', 'tunnel']);
// tools that act on a single tap
const PLACE_TOOLS = new Set(['station', 'yard', 'train']);

function paintAt(r, c) {
  const key = r * COLS + c;
  if (stroke.done.has(key)) return;
  stroke.done.add(key);
  if (tool === 'eraser') {
    const k = cell(r, c);
    if (!stroke.snap && (k.o || k.t !== null || k.b)) { stroke.snap = true; pushUndo(); }
    const res = eraseCell(r, c);
    if (res === 'busy') sfx('boop');
    else if (res) { changed(); sfx('erase'); puff(r, c); }
    return;
  }
  placeAt(r, c);
}

// placing stations, yards, trains etc. is added below
function placeAt(r, c) {
  if (tool === 'train') {
    const k = cell(r, c);
    if (!k || k.t === null || trainOnCell(r, c)) { sfx('boop'); return; }
    pushUndo(); stroke.snap = true;
    const t = placeTrain(trainType, r, c);
    if (!t) { undoStack.pop(); sfx('boop'); return; }
    t.poses = carPoses(t);
    sparkleAt(c + 0.5, r + 0.5); sfx('pop'); setTimeout(() => sfx('honk', t.type), 180);
    saveSoon();
    return;
  }
  placeThing(r, c);
}
function placeThing(r, c) {
  const k = cell(r, c);
  const ok = () => { if (!stroke.snap) { stroke.snap = true; pushUndo(); } };
  const land = k.g === 'grass' || k.g === 'road';
  if (tool === 'tree' || tool === 'house') {
    if (k.g !== 'grass' || k.t !== null || k.o || k.b) { if (!k.o) sfx('boop'); return; }
    ok(); k.o = tool; k.v = Math.floor(Math.random() * 4);
    changed(); sfx(tool === 'tree' ? 'plant' : 'knock'); puff(r, c);
  } else if (tool === 'bridge') {
    if (k.g !== 'water' || k.b) { if (!k.b) sfx('boop'); return; }
    ok(); k.b = 1; changed(); sfx('clack'); puff(r, c);
  } else if (tool === 'station' || tool === 'yard' || tool === 'tunnel') {
    if (!land || (k.o && k.o !== tool)) { sfx('boop'); return; }
    if (k.o === tool) return;
    ok();
    if (tool !== 'tunnel' && k.t === null) tapTrack(r, c);
    k.o = tool;
    // yards and stations on a straight track grow to two cells: a long shed / a long platform
    if (tool !== 'tunnel' && k.t !== null && bits(k.t) === 2 && pieces(k.t)[0][0] === OPP[pieces(k.t)[0][1]]) {
      for (const d of DIRS) {
        if (!(k.t & d)) continue;
        const n = cell(r + DY[d], c + DX[d]);
        if (n && n.o === null && n.t === (DY[d] ? N | S : E | W) && (n.g === 'grass' || n.g === 'road')) { n.o = tool; break; }
      }
    }
    changed(); sfx(tool === 'yard' ? 'snore' : 'pop'); puff(r, c);
  }
}
function tapThingAt(r, c) {
  const k = cell(r, c), idx = r * COLS + c;
  if (k.o === 'station' && tool !== 'station' || (k.o === 'station' && tool === 'station')) {
    const st = stState(idx);
    st.hop = 0.9; sfx('hop');
    const t = trainAtStation(idx);
    if (t && boardTrain(idx, t)) { setTimeout(() => sfx('honk', t.type), 500); }
    return true;
  }
  if (k.o === 'yard') { yardTap(idx); return true; }
  return false;
}
function yardTap(idx) { sfx('snore'); }

function trainAt(px, py) {
  const x = (px - OX) / CS, y = (py - OY) / CS;
  let best = null, bd = 0.5 * 0.5;
  for (const t of world.trains) for (const p of (t.poses || [])) {
    if (!p) continue;
    const d = (p.x - x) ** 2 + (p.y - y) ** 2;
    if (d < bd) { bd = d; best = t; }
  }
  return best;
}
function tapTrainAt(px, py) {
  const t = trainAt(px, py);
  if (!t) return false;
  if (t.honkT <= 0) { t.honkT = 1.6; sfx('honk', t.type); }
  return true;
}
function eraseTrainAt(px, py) {
  const t = trainAt(px, py);
  if (!t) return false;
  pushUndo();
  world.trains = world.trains.filter(o => o !== t);
  for (const p of t.poses) if (p) sparkleAt(p.x, p.y);
  sfx('erase'); saveSoon();
  return true;
}

// sparkles: little stars that pop out when something appears or disappears
const sparkles = [];
function sparkleAt(x, y) {
  for (let i = 0; i < 10; i++) { const a = rnd(0, TAU), v = rnd(0.6, 1.6); sparkles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(0.4, 0.8), col: ['#ffd43b', '#ff8787', '#74c0fc', '#ffffff', '#b2f2bb'][i % 5] }); }
}
function puff(r, c) { sparkleAt(c + 0.5, r + 0.5); }
function drawSparkles() {
  const dt = 1 / 60;
  for (const p of sparkles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.95; p.vy *= 0.95; }
  for (let i = sparkles.length - 1; i >= 0; i--) if (sparkles[i].life <= 0) sparkles.splice(i, 1);
  for (const p of sparkles) {
    const x = OX + p.x * CS, y = OY + p.y * CS, r = CS * 0.09 * clamp(p.life * 2, 0, 1);
    ctx.fillStyle = p.col; ctx.beginPath();
    for (let j = 0; j < 8; j++) { const a = j * Math.PI / 4, rr = j % 2 ? r * 0.4 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill();
  }
}

// ---------- the picture menu of trains ----------
const picker = document.getElementById('picker');
let trainType = 'steam';
function buildPicker() {
  TYPES.forEach(ty => makeIconButton(picker, 'train_' + ty, '', () => {
    trainType = ty; tool = 'train'; hidePicker(); refreshToolbar();
    const tb = bar.querySelector('[data-name="train"]'); if (tb) paintIcon(tb, 'train');
    sfx('honk', ty);

// ---------- audio ----------
let AC = null;
function unlockAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  if (AC && !AC._master) {
    AC._master = AC.createGain(); AC._master.gain.value = 0.8; AC._master.connect(AC.destination);
    // iOS: a tiny silent buffer on the first touch wakes the audio pipeline up
    const b = AC.createBuffer(1, 1, 22050), s = AC.createBufferSource(); s.buffer = b; s.connect(AC._master); s.start(0);
  }
}

// one soft note: frequency glide f0 -> f1, gentle attack and release
function tone(f0, dur, opt = {}) {
  if (!AC || !AC._master) return;

  const o = AC.createOscillator(), g = AC.createGain();

  const atk = opt.atk || 0.01;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  let out = g;
  if (opt.lp) { const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opt.lp; g.connect(f); out = f; }
  o.connect(g); out.connect(AC._master);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
let noiseBuf = null;
function noise(dur, opt = {}) {
  if (!AC || !AC._master) return;
  if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t0 = AC.currentTime + (opt.at || 0);

  s.buffer = noiseBuf; f.type = opt.ft || 'bandpass'; f.frequency.value = opt.f || 1200; f.Q.value = opt.q || 1;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(opt.vol || 0.2, t0 + (opt.atk || 0.005));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(AC._master);
  s.start(t0); s.stop(t0 + dur + 0.05);
}
// a horn chord: several detuned oscillators through a low-pass
function horn(freqs, dur, opt = {}) {
  for (const f of freqs) tone(f, dur, { type: opt.type || 'sawtooth', vol: (opt.vol || 0.1) / freqs.length * 2, atk: 0.04, lp: opt.lp || 1400, at: opt.at || 0 });
}

const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);
let lastBoop = 0;
function sfx(name, arg) {
  if (!AC) return;
  switch (name) {
    case 'clack': noise(0.06, { f: 2200, q: 2, vol: 0.18 }); tone(180, 0.08, { type: 'triangle', vol: 0.12 }); break;
    case 'tick': tone(900, 0.05, { vol: 0.08 }); break;
    case 'boop': { const t = performance.now(); if (t - lastBoop < 350) return; lastBoop = t; tone(300, 0.18, { to: 220, type: 'triangle', vol: 0.15 }); break; }
    case 'erase': noise(0.18, { f: 900, q: 0.7, vol: 0.18 }); tone(500, 0.15, { to: 250, vol: 0.08 }); break;
    case 'undo': tone(700, 0.22, { to: 350, type: 'triangle', vol: 0.15 }); break;
    case 'pop': tone(400, 0.14, { to: 900, vol: 0.22 }); tone(1200, 0.08, { at: 0.08, vol: 0.08 }); break;
    case 'plant': tone(520, 0.1, { to: 780, vol: 0.18 }); tone(780, 0.12, { at: 0.08, to: 1040, vol: 0.12 }); break;
    case 'knock': tone(330, 0.09, { type: 'triangle', vol: 0.25 }); tone(330, 0.09, { type: 'triangle', vol: 0.25, at: 0.14 }); break;
    case 'sweep': noise(0.8, { f: 600, q: 0.5, vol: 0.2, atk: 0.2 }); tone(900, 0.8, { to: 200, vol: 0.1, atk: 0.1 }); break;
    case 'ding': tone(NOTE(84), 0.9, { vol: 0.18 }); tone(NOTE(79), 1.1, { vol: 0.18, at: 0.35 }); break;
    case 'hop': [72, 76, 79, 84].forEach((n, i) => tone(NOTE(n), 0.16, { type: 'square', vol: 0.06, at: i * 0.09, lp: 2500 })); break;
    case 'snore': tone(110, 0.9, { to: 140, type: 'triangle', vol: 0.12, atk: 0.4, lp: 600 }); break;
    case 'chime': tone(NOTE(arg || 79), 1.4, { vol: 0.1, atk: 0.02 }); tone(NOTE((arg || 79) + 12), 1.0, { vol: 0.04 }); break;
    case 'lullaby': {
      // a slow original little tune, like a music box
      const tune = [[76, 0], [79, 0.5], [84, 1], [83, 1.75], [79, 2.25], [76, 3], [77, 3.5], [76, 4], [74, 4.5], [72, 5.25]];
      tune.forEach(([n, t]) => { tone(NOTE(n), 1.3, { vol: 0.09, at: t }); tone(NOTE(n + 12), 0.6, { vol: 0.025, at: t }); });
      [[48, 0], [55, 1], [53, 3], [48, 4.5]].forEach(([n, t]) => tone(NOTE(n), 1.8, { type: 'triangle', vol: 0.05, at: t, atk: 0.2 }));
      break;
    }
    case 'morning': {
      [[72, 0], [76, 0.12], [79, 0.24], [84, 0.36]].forEach(([n, t]) => tone(NOTE(n), 0.5, { vol: 0.1, at: t }));
      for (let i = 0; i < 4; i++) tone(2400 + i * 200, 0.08, { to: 3200, vol: 0.05, at: 0.8 + i * 0.15 });
      break;
    }
    case 'honk': honk(arg); break;
  }
}

function honk(type) {
  switch (type) {
    case 'steam': // whistle: toot-toooot
      tone(NOTE(81), 0.3, { type: 'triangle', vol: 0.18, atk: 0.03 }); tone(NOTE(85), 0.3, { type: 'triangle', vol: 0.1, atk: 0.03 });
      tone(NOTE(81), 0.7, { type: 'triangle', vol: 0.18, atk: 0.03, at: 0.38 }); tone(NOTE(85), 0.7, { type: 'triangle', vol: 0.1, atk: 0.03, at: 0.38 });
      noise(1.1, { f: 3000, q: 0.8, vol: 0.05 });
      break;
    case 'streetcar': // ding ding bell
      [0, 0.28].forEach(t => { tone(NOTE(88), 0.6, { vol: 0.2, at: t }); tone(NOTE(88) * 2.7, 0.3, { vol: 0.05, at: t }); });
      break;
    case 'subway': // two quick beeps
      [0, 0.22].forEach(t => tone(NOTE(76), 0.16, { type: 'square', vol: 0.08, at: t, lp: 2000 }));
      horn([NOTE(64), NOTE(67)], 0.5, { at: 0.5, vol: 0.12 });
      break;
    case 'freight': // low long horn
      horn([NOTE(50), NOTE(54), NOTE(57)], 1.0, { vol: 0.16, lp: 900 });
      break;
    default: // commuter: friendly two-tone horn
      horn([NOTE(69), NOTE(73)], 0.35, { vol: 0.14 });
      horn([NOTE(66), NOTE(69)], 0.5, { vol: 0.14, at: 0.4 });
  }
}

// ---------- boot ----------
if (!load()) freshWorld(true);
buildToolbar();
buildPicker();
resize();
for (const t of world.trains) t.poses = carPoses(t);
requestAnimationFrame(frame);
window.addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
</script>
